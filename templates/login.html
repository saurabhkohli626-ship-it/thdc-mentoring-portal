{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card login">
  <h2>Login</h2>
  <form method="post">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Login</button>
  </form>
  <p class="muted">Students, faculty and director use the same login page.</p>
</div>
{% endblock %}

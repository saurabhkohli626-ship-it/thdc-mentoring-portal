{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card login">
  <h2>Login</h2>
  <form method="post">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Login</button>
  </form>
  <p class="muted">Students, faculty and director use the same login page.</p>

  {% if demo_mode %}
  <div class="demo-box">
    <p><b>Just looking around?</b> Try the portal without an account:</p>
    <div class="demo-buttons">
      <a class="btn light" href="{{ url_for('demo_login', role='student') }}">Try as Student</a>
      <a class="btn light" href="{{ url_for('demo_login', role='faculty') }}">Try as Faculty</a>
      <a class="btn light" href="{{ url_for('demo_login', role='director') }}">Try as Director</a>
    </div>
  </div>
  {% endif %}
</div>
{% endblock %}
